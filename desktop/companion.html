<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="companion.css">
</head>
<body>
  <main class="companion" id="companion">
    <button id="close" aria-label="Hide companion">×</button>

    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="glow"></div>

    <div class="avatar-stage" id="avatarStage" data-state="idle">
      <div class="avatar-ring"></div>
      <div class="avatar-shadow"></div>
      <img id="avatar" src="../assets/kritam-avatar.png" alt="KRITAM, your AI companion">
      <div class="status-ring"></div>
    </div>

    <section>
      <p class="status"><i></i><span id="statusText">KRITAM IS READY</span></p>
      <h1 id="greeting">Good morning, Deepak.</h1>
      <p id="message">I’m ready to help you make today count.</p>
      <button id="open">Open KRITAM <span>↗</span></button>
    </section>
  </main>
  <script src="companion.js"></script>
</body>
</html>
