name: KRITAM Windows Preview

on:
  push:
    branches:
      - main
      - dev/kritam-quality
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build unpacked Windows preview
        run: npx electron-builder --win dir --publish never
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: KRITAM-Windows-Preview-${{ github.run_number }}
          path: dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 7
